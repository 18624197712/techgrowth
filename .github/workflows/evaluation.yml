name: Real Model Evaluation

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: model-evaluation
    env:
      TG_OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      TG_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TG_CHAT_MODEL: ${{ vars.CHAT_MODEL }}
      TG_MAX_AGENT_TOKENS: "10000"
      TG_MAX_DAILY_TOKENS: "50000"
      TECHGROWTH_EVAL_REPORT: evaluation-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e "services/api"
      - name: Run bounded evaluation
        if: env.TG_OPENAI_API_KEY != ''
        run: python -m techgrowth_api.evaluation
      - name: Require evaluation credentials
        if: env.TG_OPENAI_API_KEY == ''
        run: |
          echo "Configure the model-evaluation environment before enabling this workflow." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('evaluation-report.json') != ''
        with:
          name: model-evaluation-${{ github.run_id }}
          path: evaluation-report.json

