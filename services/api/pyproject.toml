[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techgrowth-api"
version = "0.1.0"
description = "TechGrowth API and agent workflows"
requires-python = ">=3.12"
dependencies = [
  "aiosmtplib>=3.0,<4",
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23.1,<24",
  "cryptography>=44,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "langgraph>=0.3,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyotp>=2.9,<3",
  "pywebpush>=2.0,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
techgrowth = "techgrowth_api.cli:app"
techgrowth-worker = "techgrowth_api.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/techgrowth_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
