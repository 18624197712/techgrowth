name: techgrowth

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-api-environment: &api-environment
  TG_ENVIRONMENT: production
  TG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  TG_SECURE_COOKIES: "true"
  TG_TEMP_UPLOAD_DIR: /app/data/uploads
  TG_APP_DOMAIN: ${APP_DOMAIN}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-techgrowth-web}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - edge
    logging: *default-logging

  api:
    image: ${API_IMAGE:-techgrowth-api}:${IMAGE_TAG:-local}
    build:
      context: services/api
    restart: unless-stopped
    env_file:
      - .env
    environment: *api-environment
    volumes:
      - temp_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    logging: *default-logging

  worker:
    image: ${API_IMAGE:-techgrowth-api}:${IMAGE_TAG:-local}
    build:
      context: services/api
    command: ["techgrowth-worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *api-environment
    volumes:
      - temp_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    logging: *default-logging

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  temp_uploads:
  caddy_data:
  caddy_config:
